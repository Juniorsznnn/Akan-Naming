<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Generator</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
    <div>
        <p>Akan names come from Ghanian culture.<br>
        Children were named based on the day they were born.</p>
        <p>Wouldn't you love to know what name you would have been given based on the day you were born?</p>
        <p><b>FILL IN THE FORM BELOW TO FIND OUT</b></p>

    </div>
    <form id="form1">
        <label>Birthdate</label><br>
        <input type="date" name="Date" placeholder="Birthdate"><br>
        <input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label><br>
<button type="submit">Submit</button>

    </form>
</body>
</html>
